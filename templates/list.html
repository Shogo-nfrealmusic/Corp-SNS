{% extends "base.html" %}

{% block header %}
<div class="alert alert-primary" role="alert">
    <h2>SNS within the company</h2>
</div>
{% endblock header %}

{% block content %}
<div class="container">
    {% for item in object_list %}
    <div class="alert alert-success" role="alert">
        <p>Title: {{ item.title }}</p>
        <p>Contributor: {{ item.author }}</p>
        <a href="#" class="btn btn-primary disabled" tabindex="-1" role="button" aria-disabled="true">Like</a>
        <a href="#" class="btn btn-secondary disabled" tabindex="-1" role="button" aria-disabled="true">Seen</a>
    </div>
    {% endfor %}
</div>
{% endblock content %}
