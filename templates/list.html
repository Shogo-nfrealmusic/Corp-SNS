{% extends "base.html" %}

{% block header %}
<div class="alert alert-primary" role="alert">
    <h2>SNS within the company</h2>
</div>
{% endblock header %}

{% block content %}
<div class="container">
    {% for item in object_list %}
    <div class="alert alert-success" role="alert">
        <p>Title:<a href="{% url "detail" item.pk %}">{{ item.title }}</a></p>
        <p>Contributor: {{ item.author }}</p>
        <a href="#" class="btn btn-primary" tabindex="-1" role="button" aria-disabled="true">Like {{ item.good }}</a>
        <a href="#" class="btn btn-secondary" tabindex="-1" role="button" aria-disabled="true">Seen{{ item.read }}</a>
    </div>
    {% endfor %}
    <a href="{% url "logout" %}">logout</a>
</div>
{% endblock content %}
