{% extends "base.html" %}

{% block header %}
<div class="alert alert-primary" role="alert">
    <h2>detail page</h2>
</div>
{% endblock header %}

{% block content %}
<div class="container">
    <div class="alert alert-success" role="alert">
        <p>Title: {{ object.title }}</p>
        <p>Contributor: {{ object.author }}</p>
        <p><img src = "{{ object.sns_image.url }}" width=300></p>
        <a href="{% url "good" object.pk %}" class="btn btn-primary" disabled tabindex="-1" role="button" aria-disabled="true">Like</a>
        <a href="{% url "read" object.pk %}" class="btn btn-secondary" disabled tabindex="-1" role="button" aria-disabled="true">Seen</a>
    </div>
    <a href="{% url "logout" %}">logout</a>
</div>
{% endblock content %}
